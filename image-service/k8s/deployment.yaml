apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-service
  namespace: lab2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: image-service
  template:
    metadata:
      labels:
        app: image-service
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: image-service
          image: image-service:lab2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8081
            - name: JOURNAL_SERVICE_URL
              value: http://journal-service:8082
            - name: UPLOAD_DIRECTORY
              value: /data/uploads
            - name: DATABASE_PATH
              value: /data/images.sqlite
            - name: FRONTEND_ORIGIN
              value: http://localhost:5173
          volumeMounts:
            - name: image-data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: image-data
          persistentVolumeClaim:
            claimName: image-data
