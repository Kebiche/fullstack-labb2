# Vilken port appen kör på
server.port=8083

# Databaskoppling ? PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/messagedb
spring.datasource.username=journal
spring.datasource.password=secret

# Hibernate skapar/uppdaterar tabellerna automatiskt
spring.jpa.hibernate.ddl-auto=update

# Visa SQL i terminalen (bra för debugging)
spring.jpa.show-sql=true